<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0369a1">
  <title>Sem conexão · PDV Lojas Manu</title>
  <link rel="icon" href="/favicon-32x32.png">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; font: 16px/1.6 system-ui, sans-serif; }
    main { width: 100%; max-width: 460px; padding: 36px; border: 1px solid #e2e8f0; border-radius: 16px; background: white; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 26px; line-height: 1.2; margin: 24px 0 12px; }
    p { color: #475569; margin: 12px 0 24px; }
    button { border: 0; border-radius: 8px; background: #0369a1; color: white; padding: 12px 20px; font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 3px solid #38bdf8; outline-offset: 3px; }
    small { display: block; color: #64748b; margin-top: 24px; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192x192.png" alt="Lojas Manu">
    <h1>Vamos retomar a conexão</h1>
    <p>O PDV precisa de internet para consultar clientes, pedidos e salvar vendas. Reconecte este dispositivo e tente novamente.</p>
    <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    <small>Se havia um rascunho salvo neste dispositivo, ele será retomado no PDV. Não limpe os dados do navegador.</small>
  </main>
</body>
</html>
